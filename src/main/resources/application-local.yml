# 로컬 개발용: H2 파일 DB (PostgreSQL 호환 모드)
spring:
  datasource:
    url: jdbc:h2:file:./.data/bizexpense;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

jwt:
  # 로컬 전용 키. 운영에서는 JWT_SECRET 환경변수를 사용한다.
  secret: bG9jYWwtZGV2LW9ubHktYml6ZXhwZW5zZS1qd3Qtc2VjcmV0LWtleS0yMDI2LTEwLTAz

logging:
  level:
    org.hibernate.SQL: DEBUG
