spring:
  application:
    name: bizexpense
  profiles:
    default: local
  # H2 콘솔은 local 프로필에서만 켠다
  h2:
    console:
      enabled: false
  # 영수증 첨부: 파일 1개 5MB (ExpenseFile.MAX_SIZE 와 맞춘다)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

server:
  # 배포 환경(Render 등)은 PORT 환경변수로 포트를 지정한다
  port: ${PORT:8080}
  forward-headers-strategy: framework

jwt:
  # 액세스 토큰 유효시간 (밀리초) - 기본 2시간
  access-token-validity: 7200000

demo:
  enabled: false
  password: ""

logging:
  level:
    root: INFO
    com.bizexpense: DEBUG

# API 문서: 메서드 이름 대신 정렬된 태그/경로로 보여준다
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
