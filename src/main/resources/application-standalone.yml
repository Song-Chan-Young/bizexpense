# 외부 DB 없이 단독 실행 (Docker 이미지 기본값: SPRING_PROFILES_ACTIVE=demo,standalone)
# 배포 서비스에 DB/환경변수 설정이 없어도 앱이 뜨도록, 메모리 DB 와 임의 JWT 키를 사용한다.
# 서버가 재시작되면 데이터가 초기화되고 데모 데이터가 다시 만들어진다 (체험용 서버에 적합).
# 실제 운영은 prod 프로필(PostgreSQL)을 사용한다.
spring:
  datasource:
    url: jdbc:h2:mem:bizexpense;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  # JWT_SECRET 이 없으면 기동할 때마다 임의 키를 만든다 (재시작 시 다시 로그인 필요)
  secret: ${JWT_SECRET:${random.uuid}${random.uuid}}

logging:
  level:
    com.bizexpense: INFO
