# 운영용: PostgreSQL. 접속 정보와 JWT 키는 환경변수로 주입한다.
# DB_URL 을 주면 그대로 쓰고, 없으면 DB_HOST / DB_PORT / DB_NAME 으로 만든다 (Render 는 값을 따로 준다).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.bizexpense: INFO
